# Projet Xcode généré par XcodeGen (`make project`).
#
# Le .xcodeproj n'est volontairement pas versionné : il est reconstruit à partir
# de ce fichier. On évite ainsi les conflits de merge illisibles sur le
# pbxproj — un des pires irritants d'un projet iOS à plusieurs.
name: Expira

options:
  bundleIdPrefix: app.expira
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ExpiraKit:
    path: ExpiraKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Expira:
    type: application
    platform: iOS
    sources:
      - path: Expira
        excludes:
          - "Support/Info.plist"
    dependencies:
      - package: ExpiraKit
        product: ExpiraCore
      - package: ExpiraKit
        product: ExpiraDesignSystem
      - package: ExpiraKit
        product: ExpiraCatalog
      - package: ExpiraKit
        product: ExpiraData
      - package: ExpiraKit
        product: ExpiraScanning
      - package: ExpiraKit
        product: ExpiraNotifications
      - package: ExpiraKit
        product: ExpiraCommerce
      - package: ExpiraKit
        product: ExpiraAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.expira.Expira
        PRODUCT_NAME: Expira
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Expira/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

schemes:
  Expira:
    build:
      targets:
        Expira: all
    run:
      config: Debug
      # Permet de tester les abonnements sans compte App Store Connect.
      storeKitConfiguration: Expira/Support/Expira.storekit
    test:
      config: Debug
      targets:
        - package: ExpiraKit/ExpiraCoreTests
    profile:
      config: Release
    archive:
      config: Release
